openapi: 3.0.3
info:
  title: Account Service API
  version: 1.0.0
  description: >
    Draft contract for account operations and single-currency transfers.
    Monetary amounts are integer minor units. Ledger funding and money-model
    choices are tracked separately in issues #2 and #3.
servers:
  - url: /
paths:
  /api/v1/accounts:
    post:
      summary: Open a new single-currency account
      operationId: openAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccount'
      responses:
        '201':
          description: Account created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Invalid account request
  /api/v1/accounts/{id}:
    get:
      summary: Retrieve an account and current balance
      operationId: getAccount
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Account found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          description: Unknown account
  /api/v1/accounts/{id}/entries:
    get:
      summary: List account ledger entries
      operationId: listEntries
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A Spring Data page of ledger entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/LedgerEntry'
                  totalElements:
                    type: integer
                    format: int64
                  totalPages:
                    type: integer
                  number:
                    type: integer
                  size:
                    type: integer
        '404':
          description: Unknown account
  /api/v1/transfers:
    post:
      summary: Transfer minor units between accounts of the same currency
      operationId: transfer
      description: >
        Reusing the same reference and exactly the same payload returns the
        original transfer. Reusing a reference with a different payload is
        rejected. Transfers are atomic and debit and credit one account each.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransfer'
      responses:
        '201':
          description: Transfer created or previously recorded under this reference
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '400':
          description: Invalid transfer request
        '404':
          description: Unknown account
        '409':
          description: Reference already belongs to a different transfer
        '422':
          description: Insufficient funds, currency mismatch or balance overflow
  /api/v1/transfers/{id}:
    get:
      summary: Retrieve a transfer
      operationId: getTransfer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Transfer found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '404':
          description: Unknown transfer
components:
  parameters:
    AccountId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    CreateAccount:
      type: object
      required: [ownerId, currency]
      properties:
        ownerId:
          type: string
          minLength: 1
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: EUR
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
        currency:
          type: string
          example: EUR
        balanceMinor:
          type: integer
          format: int64
          example: 1050
    CreateTransfer:
      type: object
      required: [sourceAccountId, targetAccountId, amountMinor, reference]
      properties:
        sourceAccountId:
          type: string
          format: uuid
        targetAccountId:
          type: string
          format: uuid
        amountMinor:
          type: integer
          format: int64
          minimum: 1
        reference:
          type: string
          minLength: 1
    Transfer:
      allOf:
        - $ref: '#/components/schemas/CreateTransfer'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
    LedgerEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        transferId:
          type: string
          format: uuid
        amountMinor:
          type: integer
          format: int64
        direction:
          type: string
          enum: [DEBIT, CREDIT]
        createdAt:
          type: string
          format: date-time
